# ============ DomSanta - тёмный новогодний ивент ============
# Цвета: &-коды. Время в секундах, если не указано иное.

world: grief-1                 # мир ивента (если не найден - первый обычный мир)
inventory-title: "&b❄ &4&lПОДАРОК &f&lСАНТЫ &b❄"

location:
  x-min: -5000
  x-max: 5000
  z-min: -5000
  z-max: 5000
  flatness-check: true         # проверять ровность места
  max-height-diff: 6           # макс. перепад высот в пределах площадки
  max-attempts: 25             # попыток найти место

timers:
  open-after-seconds: 300              # 5 минут до открытия
  disappear-after-open-seconds: 1200   # 20 минут после открытия, потом ивент исчезает

zone:
  radius: 20                   # граница ивента (стражи не выходят за неё)

remove-when-empty: false       # убрать ивент раньше, если всё забрали

auto-start:
  enabled: true
  interval-minutes: 180        # через сколько минут запускается ивент
  spawn-chance: 50             # шанс (%) что ивент появится по таймеру
  min-online-players: 0
  alerts-minutes: [120, 60, 30, 1]

players-see-coordinates: true  # показывать координаты игрокам в /domsanta и в оповещении

bossbar:
  style: SEGMENTED_10          # SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
  locked-color: PURPLE
  open-color: RED
  last-minute-color: WHITE
  locked-title: "&b{snow} &4&lПОДАРОК САНТЫ &8» &7Открытие через &f&l{time} &8│ &7Координаты: &e{coords} &8│ &7Стражи: &c{guards} &b{snow}"
  open-title: "&f{snow} &c&lПОДАРОК ОТКРЫТ &8» &7Исчезнет через &f&l{time} &8│ &7Координаты: &e{coords} &8│ &7Стражи: &c{guards} &f{snow}"

hologram:
  locked:
    - "&b❄ &4&lПОДАРОК &f&lСАНТЫ &b❄"
    - "&cЗакрыт"
    - "&7Откроется через: &f{time}"
  open:
    - "&b❄ &4&lПОДАРОК &f&lСАНТЫ &b❄"
    - "&aОткрыт!"
    - "&7Исчезнет через: &f{time}"

guards:
  count: 5
  health: 60
  damage: 7
  totem-health: 45
  totem-damage: 9
  name: "&4&lСтраж Санты"
  spawn-radius: 6.8        # вокруг дома, снаружи

# Лут: slots - номера слотов (0-53), можно диапазоны "0-11,15-20", chance - шанс % на КАЖДЫЙ слот
